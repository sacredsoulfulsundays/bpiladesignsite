<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>B Pila Design Studio — Commercial + Institutional Credentials</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="assets/fonts.css">
  <link rel="stylesheet" href="assets/deck.css">
</head>
<body>
  <div id="frame">
    <div id="stage">
      <div id="slides"></div>
      <div id="wipe-edge"></div>
      <div id="grain"></div>
      <div id="cursor"></div>
    </div>
    <div id="hud">
      <div id="progress"><span></span></div>
      <div class="pager" id="pager">
        <button type="button" class="pager-btn" id="prev-btn" aria-label="Previous slide">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg>
        </button>
        <div class="rail"></div>
        <button type="button" class="pager-btn" id="next-btn" aria-label="Next slide">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 5.5 16 12l-6.5 6.5"/></svg>
        </button>
      </div>
      <div id="hint">Click or →  ·  F fullscreen  ·  P autoplay</div>
    </div>
  </div>
  <script src="vendor/anime.min.js"></script>
  <script src="js/deck.js"></script>
</body>
</html>
